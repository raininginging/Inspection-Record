<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0d6efd">
<title>Rental Unit Inspection Form</title>
<style>
  :root {
    --pad: 16px;
    --radius: 10px;
    --line: #d0d0d0;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #5c6370;
    --blue: #0d6efd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.45;
    padding: 0;
  }
  .screen { min-height: 100vh; }
  #listScreen { background: #fff; }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: #f2f2f7;
    border-bottom: 1px solid #d6d6dc;
  }
  .nav h1 { font-size: 17px; margin: 0; font-weight: 700; text-align: center; flex: 1; }
  .nav-btn {
    width: auto;
    min-height: 0;
    padding: 6px 4px;
    background: none;
    color: #007aff;
    font-size: 17px;
    font-weight: 400;
  }
  .nav-btn.strong { font-size: 28px; line-height: 1; font-weight: 300; }
  .record-list { list-style: none; margin: 0; padding: 0 0 env(safe-area-inset-bottom); }
  .record-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid #e5e5ea;
    background: #fff;
  }
  .record-main { flex: 1; min-width: 0; }
  .record-name { font-size: 17px; }
  .record-meta { color: #8e8e93; font-size: 13px; margin-top: 2px; }
  .delete-btn {
    width: 28px;
    min-height: 28px;
    height: 28px;
    padding: 0;
    border-radius: 50%;
    background: #ff3b30;
    font-size: 22px;
    line-height: 26px;
    font-weight: 400;
  }
  .empty { text-align: center; color: #8e8e93; padding: 48px 24px; }
  #formScreen { display: none; padding: calc(12px + env(safe-area-inset-top)) var(--pad) calc(28px + env(safe-area-inset-bottom)); }
  .dialog-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 24px;
  }
  .dialog {
    width: 100%;
    max-width: 320px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }
  .dialog h2 { margin: 18px 16px 10px; font-size: 18px; }
  .dialog input {
    width: calc(100% - 32px);
    margin: 0 16px 14px;
    min-height: 40px;
  }
  .dialog-actions { display: flex; border-top: 1px solid #d6d6dc; }
  .dialog-actions button {
    flex: 1;
    background: none;
    color: #007aff;
    min-height: 44px;
    font-weight: 400;
  }
  .dialog-actions button + button { border-left: 1px solid #d6d6dc; font-weight: 600; }
  h1 { font-size: 1.45rem; margin: 8px 0 18px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  label {
    display: block;
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: #222;
  }
  input[type="text"],
  input[type="number"],
  select,
  textarea {
    width: 100%;
    font-size: 16px; /* iOS won't zoom if >= 16px */
    padding: 12px 12px;
    border: 1px solid #b9b9b9;
    border-radius: 8px;
    background: #fff;
    min-height: 46px;
  }
  textarea { min-height: 120px; resize: vertical; }
  .dialog input[type="text"] {
    width: calc(100% - 32px);
    max-width: calc(100% - 32px);
    margin: 0 16px 14px;
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    margin: 0;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
  }
  button.secondary { background: #3d4f66; }
  button.danger { background: #b42318; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 16px; }
  #roomSelectSection { display: none; }
  #currentRoomTable { display: none; }
  .item-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin-top: 12px;
    background: #fafafa;
  }
  .item-card h3 {
    font-size: 1rem;
    margin: 0 0 10px;
  }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 10px; }
  #output {
    white-space: pre-wrap;
    background: #fff;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: auto;
  }
</style>
</head>
<body>

<div id="listScreen" class="screen">
  <div class="nav">
    <button type="button" class="nav-btn" id="editListBtn" onclick="toggleEditList()">Edit</button>
    <h1>Inspection Record</h1>
    <button type="button" class="nav-btn strong" onclick="openNewDialog()">+</button>
  </div>
  <ul id="recordList" class="record-list"></ul>
</div>

<div id="newDialog" class="dialog-mask">
  <div class="dialog">
    <h2>New Inspection</h2>
    <input type="text" id="newName" placeholder="New Inspection" enterkeyhint="done">
    <div class="dialog-actions">
      <button type="button" onclick="closeNewDialog()">Cancel</button>
      <button type="button" onclick="createInspection()">OK</button>
    </div>
  </div>
</div>

<div id="formScreen" class="screen">
  <div class="nav" style="margin: -12px calc(-1 * var(--pad)) 16px;">
    <button type="button" class="nav-btn" onclick="backToList()">Records</button>
    <h1 id="formTitle">Inspection</h1>
    <span style="width:64px"></span>
  </div>
  <h1>Rental Unit Inspection Form</h1>

<div class="card stack">
  <div><label for="tenant">Tenant Name</label><input type="text" id="tenant"></div>
  <div><label for="landlord">Landlord Name</label><input type="text" id="landlord"></div>
  <div><label for="address">Address</label><input type="text" id="address"></div>
  <div><label for="projectNo">Project No</label><input type="text" id="projectNo"></div>
  <div><label for="inspector">Inspector</label><input type="text" id="inspector"></div>
  <div><label for="date">Inspection Date</label><input type="text" id="date" placeholder="YYYY-MM-DD"></div>
  <div><label for="nature">Nature of Inspection</label><input type="text" id="nature"></div>
  <div><label for="requestedBy">Requested by</label><input type="text" id="requestedBy"></div>
  <div><label for="totalCost">Total Estimated Cost ($)</label><input type="number" id="totalCost" step="10"></div>
</div>

<div class="card">
  <h2>Configure Unit Layout</h2>
  <div class="stack">
    <div>
      <label for="numKitchens">Number of Kitchens (1-3)</label>
      <select id="numKitchens">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div>
      <label for="numBathrooms">Number of Bathrooms (1-3)</label>
      <select id="numBathrooms">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div>
      <label for="numCorridors">Number of Corridors (1-3)</label>
      <select id="numCorridors">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>
    <div>
      <label for="numBedrooms">Number of Bedrooms (incl. Master, 1-5)</label>
      <select id="numBedrooms">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <button type="button" onclick="configureRooms()">Apply Configuration</button>
  </div>
</div>

<div id="roomSelectSection" class="card">
  <h2>Select Room to Inspect</h2>
  <p class="hint">Choose one room, fill it, then choose the next. Scroll to move down.</p>
  <select id="roomSelect" onchange="showRoomTable()">
    <option value="">-- Choose a Room --</option>
  </select>
</div>

<div id="currentRoomTable" class="card"></div>

<div class="btn-row">
  <button type="button" onclick="generateOutput()">Generate Formatted Report</button>
  <button type="button" class="secondary" onclick="shareWord()">Share Word</button>
  <button type="button" onclick="saveCurrentRecord()">Save</button>
</div>

<div id="output"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const roomItems = {
  "KITCHEN": ["Windows and doors", "Walls / Trims", "Ceiling", "Flooring", "Stove (Ownership)", "Rangehood", "Refrigerator (Ownership)", "Dishwasher (Ownership)", "Sink / Faucets", "Cupboards", "Counter Top", "Electrical / Lighting", "Other"],
  "DINING ROOM": ["Windows and doors", "Walls / Trims", "Ceiling", "Flooring", "Electrical / Lighting", "Other"],
  "LIVING ROOM": ["Windows and Doors", "Closets", "Walls / Trims", "Ceiling", "Flooring", "Electrical / Lighting", "Other"],
  "LAUNDRY ROOM": ["Windows and doors", "Closets", "Walls / Trims", "Ceiling", "Flooring", "Sink / Cabinet / Faucets", "Electrical Fixtures", "Other"],
  "STAIRWELLS": ["Guardrails / Handrails", "Walls / Trims", "Ceiling", "Stairs / Landing", "Electrical Fixtures", "Other"],
  "BASEMENT": ["Windows and doors", "Closets", "Walls / Trims", "Ceiling", "Flooring", "Electrical / Lighting", "Other"],
  "MECHANICAL": ["Water Supply", "Water distribution", "Wastewater system", "Drainage & vents", "Plumbing", "Heating System", "Thermostats", "Hot Water Tank", "HRV & Grill", "Dryer Hose & Grill", "Potable Water Treatment", "Other"],
  "ELECTRICAL": ["Smoke Detector / CO detectors", "Electrical panel", "Electrical Wiring", "Exterior Lighting", "Others"],
  "GENERAL": ["Windows and doors", "Clean-up", "Content Disposal", "Clean-up of Appliances", "Prime & Paint all units", "Garbage / Utility Room", "Other"],
  "EXTERIOR": ["Siding", "Roofing", "Steps & Landings", "Access Ramp", "Clothline", "Landscaping", "Driveway / Walkways", "Detached structure", "Parking Area", "Fences", "Others"],
  "CORRIDOR": ["Windows and Doors", "Closets", "Walls / Trims", "Ceiling", "Flooring", "Electrical / Lighting", "Other"],
  "BATHROOM": ["Windows and doors", "Walls / Trims", "Ceiling", "Flooring", "Sink / Cabinet / Faucets", "Medicine Cabinet / Mirror", "Bathtub / Shower / Faucets", "Toilet", "Electrical / Lighting", "Exhaust fan", "Bathroom hardware", "Other"],
  "BEDROOM": ["Windows and Doors", "Closets", "Walls / Trims", "Ceiling", "Flooring", "Electrical / Lighting", "Other"]
};

const codes = ["", "A", "Re", "Rp", "ReCB", "RpCB", "HI", "Ni"];

let data = {};
let roomList = [];
let activeRoom = "";

function configureRooms() {
  const numKitchens = parseInt(document.getElementById("numKitchens").value, 10);
  const numBathrooms = parseInt(document.getElementById("numBathrooms").value, 10);
  const numCorridors = parseInt(document.getElementById("numCorridors").value, 10);
  const numBedrooms = parseInt(document.getElementById("numBedrooms").value, 10);

  roomList = [];
  for (let i = 1; i <= numKitchens; i++) roomList.push(`KITCHEN ${i}`);
  for (let i = 1; i <= numBathrooms; i++) roomList.push(`BATHROOM ${i}`);
  roomList.push("DINING ROOM", "LIVING ROOM");
  if (numBedrooms >= 1) roomList.push("MASTER BEDROOM");
  for (let i = 2; i <= numBedrooms; i++) roomList.push(`BEDROOM ${i}`);
  for (let i = 1; i <= numCorridors; i++) roomList.push(`CORRIDOR ${i}`);
  roomList = roomList.concat([
    "LAUNDRY ROOM", "STAIRWELLS", "BASEMENT", "MECHANICAL",
    "ELECTRICAL", "GENERAL", "EXTERIOR", "Inspection Notes"
  ]);

  fillRoomSelects("");
  activeRoom = "";
  document.getElementById("roomSelectSection").style.display = "block";
  document.getElementById("currentRoomTable").style.display = "none";
  document.getElementById("currentRoomTable").innerHTML = "";
  window.scrollTo({ top: document.getElementById("roomSelectSection").offsetTop - 12, behavior: "smooth" });
}

function fillRoomSelects(selected) {
  const html = '<option value="">-- Choose a Room --</option>' +
    roomList.map(room => `<option value="${room}" ${room === selected ? "selected" : ""}>${room}</option>`).join("");
  const top = document.getElementById("roomSelect");
  const bottom = document.getElementById("roomSelectBottom");
  if (top) top.innerHTML = html;
  if (bottom) bottom.innerHTML = html;
}

function currentRoomName() {
  return activeRoom || "";
}

function flushVisibleInputs() {
  const notesEl = document.getElementById("inspectionNotes");
  if (notesEl) data["__NOTES__"] = { notes: notesEl.value.trim() };

  const selected = activeRoom;
  if (!selected || selected === "Inspection Notes") return;
  const baseType = selected.startsWith("KITCHEN") ? "KITCHEN" :
                   selected.startsWith("BATHROOM") ? "BATHROOM" :
                   selected.startsWith("CORRIDOR") ? "CORRIDOR" :
                   selected.startsWith("BEDROOM") || selected === "MASTER BEDROOM" ? "BEDROOM" : selected;
  const items = roomItems[baseType] || [];
  items.forEach((item, index) => {
    const codeEl = document.getElementById(`code-${index}`);
    const descEl = document.getElementById(`desc-${index}`);
    const costEl = document.getElementById(`cost-${index}`);
    if (!codeEl || !descEl || !costEl) return;
    const code = codeEl.value.trim();
    const desc = descEl.value.trim();
    const cost = costEl.value.trim();
    const key = `${selected}||${item}`;
    if (code || desc || cost) data[key] = { code, desc, cost };
    else delete data[key];
  });
}

function roomsFromSavedData() {
  const rooms = [];
  Object.keys(data).forEach(key => {
    if (key === "__NOTES__" || !key.includes("||")) return;
    const room = key.split("||")[0];
    if (room && !rooms.includes(room)) rooms.push(room);
  });
  return rooms;
}

function showRoomTable() {
  flushVisibleInputs();
  const selected = document.getElementById("roomSelect").value ||
    (document.getElementById("roomSelectBottom") && document.getElementById("roomSelectBottom").value) || "";
  fillRoomSelects(selected);
  activeRoom = selected;
  const container = document.getElementById("currentRoomTable");
  container.innerHTML = "";
  container.style.display = "none";
  if (!selected) return;

  if (selected === "Inspection Notes") {
    container.style.display = "block";
    container.innerHTML = `
      <h2>Inspection Notes</h2>
      <textarea id="inspectionNotes" placeholder="General notes (multi-line OK)..."></textarea>
      <div class="btn-row" style="margin-top:12px;">
        <button type="button" onclick="saveRoom()">Save Room</button>
      </div>
      <div class="card" style="margin:16px 0 0;padding:12px;">
        <h2>Select Next Room</h2>
        <select id="roomSelectBottom" onchange="showRoomFromBottom()">
          <option value="">-- Choose a Room --</option>
        </select>
      </div>
    `;
    if (data["__NOTES__"]) {
      document.getElementById("inspectionNotes").value = data["__NOTES__"].notes || "";
    }
    fillRoomSelects(selected);
    return;
  }

  const baseType = selected.startsWith("KITCHEN") ? "KITCHEN" :
                   selected.startsWith("BATHROOM") ? "BATHROOM" :
                   selected.startsWith("CORRIDOR") ? "CORRIDOR" :
                   selected.startsWith("BEDROOM") || selected === "MASTER BEDROOM" ? "BEDROOM" : selected;
  const items = roomItems[baseType] || [];

  container.style.display = "block";
  let html = `<h2>${selected}</h2><p class="hint">Blank if this room was never filled. Previously saved answers will appear here.</p>`;
  items.forEach((item, index) => {
    const key = `${selected}||${item}`;
    const saved = data[key] || {};
    html += `
      <div class="item-card">
        <h3>${item}</h3>
        <label>Code</label>
        <select id="code-${index}">${codes.map(c => `<option value="${c}" ${saved.code === c ? "selected" : ""}>${c || "—"}</option>`).join("")}</select>
        <label style="margin-top:10px;">Condition / Description</label>
        <textarea id="desc-${index}" placeholder="Multiple lines OK">${escapeHtml(saved.desc || "")}</textarea>
        <label style="margin-top:10px;">Est. Cost ($)</label>
        <input type="number" id="cost-${index}" step="10" min="0" value="${escapeHtml(saved.cost || "")}">
      </div>
    `;
  });
  html += `
    <div class="btn-row" style="margin-top:16px;">
      <button type="button" onclick="saveRoom()">Save Room</button>
    </div>
    <div class="card" style="margin:8px 0 0;padding:12px;">
      <h2>Select Next Room</h2>
      <p class="hint">Save this room first, then pick the next one here. You do not need to scroll back up.</p>
      <select id="roomSelectBottom" onchange="showRoomFromBottom()"></select>
    </div>
  `;
  container.innerHTML = html;
  fillRoomSelects(selected);
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/"/g, "&quot;");
}

function updateEntry(key, index) {
  const codeEl = document.getElementById(`code-${index}`);
  const descEl = document.getElementById(`desc-${index}`);
  const costEl = document.getElementById(`cost-${index}`);
  if (!codeEl || !descEl || !costEl) return;
  const code = codeEl.value.trim();
  const desc = descEl.value.trim();
  const cost = costEl.value.trim();
  if (code || desc || cost) {
    data[key] = { code, desc, cost };
    codeEl.closest(".item-card").style.borderColor = "#2f9e44";
  }
}

function saveNotes() {
  const notes = document.getElementById("inspectionNotes").value.trim();
  data["__NOTES__"] = { notes };
}

function saveRoom() {
  flushVisibleInputs();
  saveData(true);
  const next = document.getElementById("roomSelectBottom");
  if (next) next.scrollIntoView({ behavior: "smooth", block: "center" });
}

function showRoomFromBottom() {
  const bottom = document.getElementById("roomSelectBottom");
  const top = document.getElementById("roomSelect");
  if (bottom && top) top.value = bottom.value;
  showRoomTable();
}

function generateOutput() {
  flushVisibleInputs();
  saveData(true);

  let rooms = roomList.filter(room => room !== "Inspection Notes");
  roomsFromSavedData().forEach(room => {
    if (!rooms.includes(room)) rooms.push(room);
  });

  let itemTotal = 0;
  Object.keys(data).forEach(key => {
    const cost = parseFloat((data[key] && data[key].cost) || "");
    if (!isNaN(cost)) itemTotal += cost;
  });
  if (itemTotal && !document.getElementById("totalCost").value) {
    document.getElementById("totalCost").value = String(itemTotal);
  }

  let text = "RENTAL UNIT INSPECTION RECORD\n".padEnd(60, "-") + "\n\n";
  text += `Tenant .......... ${document.getElementById("tenant").value.trim() || "—"}\n`;
  text += `Landlord ........ ${document.getElementById("landlord").value.trim() || "—"}\n`;
  text += `Address ......... ${document.getElementById("address").value.trim() || "—"}\n`;
  text += `Project No ...... ${document.getElementById("projectNo").value.trim() || "—"}\n`;
  text += `Inspector ....... ${document.getElementById("inspector").value.trim() || "—"}\n`;
  text += `Date ............ ${document.getElementById("date").value.trim() || "—"}\n`;
  text += `Nature .......... ${document.getElementById("nature").value.trim() || "—"}\n`;
  text += `Requested by .... ${document.getElementById("requestedBy").value.trim() || "—"}\n\n`;

  rooms.forEach(room => {
    if (room === "Inspection Notes") return;
    const baseType = room.startsWith("KITCHEN") ? "KITCHEN" :
                     room.startsWith("BATHROOM") ? "BATHROOM" :
                     room.startsWith("CORRIDOR") ? "CORRIDOR" :
                     room.startsWith("BEDROOM") || room === "MASTER BEDROOM" ? "BEDROOM" : room;
    const items = roomItems[baseType] || [];
    let hasContent = false;
    let roomBlock = `${room.toUpperCase()}\n`;
    items.forEach(item => {
      const key = `${room}||${item}`;
      const entry = data[key];
      if (entry && (entry.desc || entry.code)) {
        hasContent = true;
        roomBlock += `  → ${item}\n`;
        roomBlock += `    Code: ${entry.code || "—"}\n`;
        roomBlock += `    Description:\n${entry.desc ? entry.desc.split("\n").map(l => "      " + l).join("\n") : "      —"}\n`;
        if (entry.cost) roomBlock += `    Est. Cost: $${entry.cost}\n`;
        roomBlock += "\n";
      }
    });
    if (hasContent) text += roomBlock;
  });

  if (data["__NOTES__"] && data["__NOTES__"].notes) {
    text += "\nINSPECTION NOTES:\n";
    text += data["__NOTES__"].notes.split("\n").map(l => l ? "  " + l : "").join("\n") + "\n";
  }

  text += "\nTotal Estimated Cost: $" + (document.getElementById("totalCost").value || "—") + "\n";
  document.getElementById("output").textContent = text;
  document.getElementById("output").scrollIntoView({ behavior: "smooth", block: "start" });
}

function reportFileName(ext) {
  const project = (document.getElementById("projectNo").value || "").trim().replace(/[^\w\-]+/g, "_");
  const address = (document.getElementById("address").value || "").trim().replace(/[^\w\-]+/g, "_");
  const date = (document.getElementById("date").value || "").trim().replace(/[^\w\-]+/g, "_");
  const part = project || address || date || "inspection";
  return "Inspection-Record-" + part + (ext || ".docx");
}

function xmlEscape(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function centerOnLine(value, width) {
  const text = String(value || "").trim();
  const pad = "\u00A0";
  const size = Math.max(width, text.length + 8);
  if (!text) return pad.repeat(size);
  const left = Math.floor((size - text.length) / 2);
  const right = size - text.length - left;
  return pad.repeat(Math.max(left, 2)) + text + pad.repeat(Math.max(right, 6));
}

function field(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function mergeEntries(roomNames, item) {
  const combined = { code: "", desc: "", cost: "" };
  roomNames.forEach(room => {
    const entry = data[`${room}||${item}`];
    if (!entry) return;
    if (entry.code && !combined.code) combined.code = entry.code;
    if (entry.desc) combined.desc = combined.desc ? combined.desc + "\n" + entry.desc : entry.desc;
    if (entry.cost) {
      const a = parseFloat(combined.cost || "0");
      const b = parseFloat(entry.cost || "0");
      combined.cost = String((isNaN(a) ? 0 : a) + (isNaN(b) ? 0 : b) || entry.cost);
    }
  });
  return combined;
}

function extraRoomNotes() {
  const extras = [];
  Object.keys(data).forEach(key => {
    if (key === "__NOTES__" || !key.includes("||")) return;
    const room = key.split("||")[0];
    if (/^KITCHEN [2-9]$/.test(room) || /^BATHROOM [2-9]$/.test(room) || /^CORRIDOR [2-9]$/.test(room)) {
      const item = key.split("||")[1];
      const entry = data[key];
      if (entry && (entry.code || entry.desc || entry.cost)) {
        extras.push(`${room} / ${item}: ${[entry.code, entry.desc, entry.cost ? "$" + entry.cost : ""].filter(Boolean).join(" — ")}`);
      }
    }
  });
  return extras.join("\n");
}

const TEMPLATE_ROOMS = [
  { title: "KITCHEN / CUISINE", aliases: ["KITCHEN 1", "KITCHEN"], items: roomItems.KITCHEN },
  { title: "DINING ROOM / SALLE A DINER", aliases: ["DINING ROOM"], items: roomItems["DINING ROOM"] },
  { title: "LIVING ROOM / SALON", aliases: ["LIVING ROOM"], items: roomItems["LIVING ROOM"] },
  { title: "CORRIDOR", aliases: ["CORRIDOR 1", "CORRIDOR"], items: roomItems.CORRIDOR },
  { title: "MASTER BEDROOMS / CHAMBRE DES MAITRES", aliases: ["MASTER BEDROOM"], items: roomItems.BEDROOM },
  { title: "BEDROOM 2 / CHAMBRE A COUCHER 2", aliases: ["BEDROOM 2"], items: roomItems.BEDROOM },
  { title: "BEDROOM 3 / CHAMBRE A COUCHER 3", aliases: ["BEDROOM 3"], items: roomItems.BEDROOM },
  { title: "BEDROOM 4 / CHAMBRE A COUCHER 4", aliases: ["BEDROOM 4"], items: roomItems.BEDROOM },
  { title: "BEDROOM 5 / CHAMBRE A COUCHER 5", aliases: ["BEDROOM 5"], items: roomItems.BEDROOM },
  { title: "BATHROOM / SALLE DE BAIN", aliases: ["BATHROOM 1", "BATHROOM"], items: roomItems.BATHROOM },
  { title: "LAUNDRY ROOM / SALLE DE LAVAGE", aliases: ["LAUNDRY ROOM"], items: roomItems["LAUNDRY ROOM"] },
  { title: "STAIRWELLS / PUIT D'ESCALIER", aliases: ["STAIRWELLS"], items: roomItems.STAIRWELLS },
  { title: "BASEMENT / SOUS-SOL", aliases: ["BASEMENT"], items: roomItems.BASEMENT },
  { title: "MECHANICAL / MECANIQUE", aliases: ["MECHANICAL"], items: roomItems.MECHANICAL },
  { title: "ELECTRICAL / ELECTRICITE", aliases: ["ELECTRICAL"], items: roomItems.ELECTRICAL },
  { title: "GENERAL / GENERAL", aliases: ["GENERAL"], items: roomItems.GENERAL },
  { title: "EXTERIOR / EXTERIEUR", aliases: ["EXTERIOR"], items: roomItems.EXTERIOR }
];

function wText(text, bold) {
  return `<w:p><w:pPr><w:spacing w:after="60"/></w:pPr><w:r>${bold ? "<w:rPr><w:b/></w:rPr>" : ""}<w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
}

function wCell(text, width, bold, span) {
  const grid = span ? `<w:gridSpan w:val="${span}"/>` : "";
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${grid}<w:tcBorders>
    <w:top w:val="single" w:sz="4" w:color="666666"/>
    <w:left w:val="single" w:sz="4" w:color="666666"/>
    <w:bottom w:val="single" w:sz="4" w:color="666666"/>
    <w:right w:val="single" w:sz="4" w:color="666666"/>
  </w:tcBorders></w:tcPr>${wText(text, bold)}</w:tc>`;
}

function wRow(cells) {
  return `<w:tr>${cells.join("")}</w:tr>`;
}

function buildDocumentXml() {
  const tenant = field("tenant");
  const landlord = field("landlord");
  const address = field("address");
  const projectNo = field("projectNo");
  const inspector = field("inspector");
  const date = field("date");
  const nature = field("nature");
  const requestedBy = field("requestedBy");
  const totalCost = field("totalCost");
  const bedrooms = field("numBedrooms") || "1";
  let notes = (data["__NOTES__"] && data["__NOTES__"].notes) || "";
  const extras = extraRoomNotes();
  if (extras) notes = notes ? notes + "\n" + extras : extras;

  const W = [2200, 3200, 1200, 2800, 1200];
  let rows = "";
  rows += wRow([
    wCell("ROOM / PIECE", W[0], true),
    wCell("ITEM", W[1], true),
    wCell("CODE", W[2], true),
    wCell("CONDITION / DESCRIPTION", W[3], true),
    wCell("EST. COST", W[4], true)
  ]);

  TEMPLATE_ROOMS.forEach(room => {
    room.items.forEach((item, idx) => {
      const entry = mergeEntries(room.aliases, item);
      rows += wRow([
        wCell(idx === 0 ? room.title : "", W[0], idx === 0),
        wCell(item, W[1], false),
        wCell(entry.code || "", W[2], false),
        wCell(entry.desc || "", W[3], false),
        wCell(entry.cost || "", W[4], false)
      ]);
    });
  });

  rows += wRow([
    wCell("Total Estimated Cost / Cout Estimes Total", W[0] + W[1] + W[2] + W[3], true, 4),
    wCell(totalCost ? "$" + totalCost : "", W[4], true)
  ]);
  rows += wRow([
    wCell("Rental Charge (monthly) / Montant du loye (mensuel)", W[0] + W[1] + W[2] + W[3], false, 4),
    wCell("", W[4], false)
  ]);
  rows += wRow([
    wCell("Tenant Damage Deposit Amount Paid / Depot paye", W[0] + W[1] + W[2] + W[3], false, 4),
    wCell("", W[4], false)
  ]);
  rows += wRow([
    wCell("Total Payable / Montant payable", W[0] + W[1] + W[2] + W[3], true, 4),
    wCell("", W[4], false)
  ]);

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${wText("Inspection - Rental Unit / Inspection – Logement locatif", true)}
${wText("REPAIR CODES: A Acceptable; Re Repair; Rp Replace; ReCB Repair Charge Back; RpCB Replace Charge Back; HI Housekeeping issue; Blank Not applicable; Ni Not inspected", false)}
${wText("Inspection request / Demande d'inspection", true)}
${wText("Requested by / Demande par: " + requestedBy, false)}
${wText("Nature of Inspection / Nature de l'inspection: " + nature, false)}
${wText("Program / Programme: ", false)}
${wText("Special instructions / Instructions speciales: ", false)}
${wText("Tenant / Locataire", true)}
${wText("Name of Tenant / Nom du locataire: " + tenant, false)}
${wText("Name of landlord / Nom du proprietaire: " + landlord, false)}
${wText("Rental unit address / Adresse: " + address, false)}
${wText("Project no / No du projet: " + projectNo, false)}
${wText("No. of Bedrooms / No. de chambre a coucher: " + bedrooms, false)}
${wText("Inspector name / Nom de l'inspecteur: " + inspector, false)}
${wText("Inspection date: " + date, false)}
<w:tbl>
<w:tblPr><w:tblW w:w="10600" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr>
<w:tblGrid><w:gridCol w:w="2200"/><w:gridCol w:w="3200"/><w:gridCol w:w="1200"/><w:gridCol w:w="2800"/><w:gridCol w:w="1200"/></w:tblGrid>
${rows}
</w:tbl>
${wText("Inspection Notes / Notes d'inspection:", true)}
${wText(notes, false)}
${wText("Inspector's Signature / Signature de l'inspecteur: ______________________    Date: __________", false)}
${wText("Tenant's Signature / Signature du locataire: ______________________", false)}
${wText("Landlord's (Agent's) Signature / Signature du proprietaire ou agent: ______________________", false)}
${wText("Signatures indicate that the Tenant and the Landlord agrees with the inspection results as noted above.", false)}
<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"/></w:sectPr>
</w:body>
</w:document>`;
}

const TEMPLATE_ROW_MAP = [];
(function buildRowMap() {
  let row = 2;
  TEMPLATE_ROOMS.forEach(room => {
    room.items.forEach(item => {
      TEMPLATE_ROW_MAP.push({ row: row, aliases: room.aliases, item: item });
      row += 1;
    });
  });
})();

async function buildWordBlob() {
  if (typeof JSZip === "undefined") throw new Error("JSZip failed to load");
  const templateHref = new URL("inspection-template.docx", window.location.href).toString();
  const res = await fetch(templateHref);
  if (!res.ok) throw new Error("Template missing");
  const zip = await JSZip.loadAsync(await res.arrayBuffer());
  let xml = await zip.file("word/document.xml").async("string");
  const values = {
    "{{H_TENANT}}": centerOnLine(field("tenant"), 46),
    "{{H_LANDLORD}}": centerOnLine(field("landlord"), 43),
    "{{H_ADDRESS}}": centerOnLine(field("address"), 38),
    "{{H_PROJECT}}": centerOnLine(field("projectNo"), 39),
    "{{H_INSPECTOR}}": centerOnLine(field("inspector"), 31),
    "{{H_DATE}}": centerOnLine(field("date"), 35),
    "{{H_NATURE}}": centerOnLine(field("nature"), 28),
    "{{H_REQUESTED}}": centerOnLine(field("requestedBy"), 35),
    "{{H_BEDROOMS}}": centerOnLine(field("numBedrooms") || "1", 16),
    "{{H_TOTAL}}": field("totalCost") ? "$" + field("totalCost") : "",
    "{{H_NOTES}}": ((data["__NOTES__"] && data["__NOTES__"].notes) || "") + (extraRoomNotes() ? "\n" + extraRoomNotes() : "")
  };
  TEMPLATE_ROW_MAP.forEach(function (rowInfo) {
    const entry = mergeEntries(rowInfo.aliases, rowInfo.item);
    values["{{R" + rowInfo.row + "_CODE}}"] = entry.code || "";
    values["{{R" + rowInfo.row + "_DESC}}"] = entry.desc || "";
    values["{{R" + rowInfo.row + "_COST}}"] = entry.cost || "";
  });
  Object.keys(values).forEach(function (token) {
    xml = xml.split(token).join(xmlEscape(values[token]));
  });
  zip.file("word/document.xml", xml);
  return zip.generateAsync({
    type: "blob",
    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

async function shareWord() {
  generateOutput();
  const fileName = reportFileName(".docx");
  try {
    const blob = await buildWordBlob();
    const file = new File([blob], fileName, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ title: "Rental Unit Inspection Record", files: [file] });
      return;
    }
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (err) {
    if (err && err.name === "AbortError") return;
    alert("Could not fill the official Word template. Upload inspection-template.docx into the same GitHub folder as the webpage, wait a minute, then refresh.");
  }
}

const RECORDS_KEY = "inspectionRecords.v1";
let records = [];
let currentId = null;
let editingList = false;

function readFormConfig() {
  return {
    numKitchens: document.getElementById("numKitchens").value,
    numBathrooms: document.getElementById("numBathrooms").value,
    numCorridors: document.getElementById("numCorridors").value,
    numBedrooms: document.getElementById("numBedrooms").value,
    tenant: document.getElementById("tenant").value,
    landlord: document.getElementById("landlord").value,
    address: document.getElementById("address").value,
    projectNo: document.getElementById("projectNo").value,
    inspector: document.getElementById("inspector").value,
    date: document.getElementById("date").value,
    nature: document.getElementById("nature").value,
    requestedBy: document.getElementById("requestedBy").value,
    totalCost: document.getElementById("totalCost").value
  };
}

function writeFormConfig(c) {
  c = c || {};
  document.getElementById("numKitchens").value = c.numKitchens || "1";
  document.getElementById("numBathrooms").value = c.numBathrooms || "1";
  document.getElementById("numCorridors").value = c.numCorridors || "1";
  document.getElementById("numBedrooms").value = c.numBedrooms || "1";
  ["tenant","landlord","address","projectNo","inspector","date","nature","requestedBy","totalCost"].forEach(id => {
    document.getElementById(id).value = c[id] != null ? c[id] : "";
  });
}

function persistRecords() {
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}

function loadRecords() {
  try {
    records = JSON.parse(localStorage.getItem(RECORDS_KEY) || "[]");
  } catch (e) {
    records = [];
  }
}

function formatDate(iso) {
  if (!iso) return "";
  return String(iso).slice(0, 10);
}

function filledCount(entryMap) {
  return Object.keys(entryMap || {}).filter(k => k !== "__NOTES__" && entryMap[k] && (entryMap[k].code || entryMap[k].desc || entryMap[k].cost)).length;
}

function renderList() {
  const list = document.getElementById("recordList");
  if (!records.length) {
    list.innerHTML = '<li class="empty">No inspection records yet.<br>Tap + to start one.</li>';
    return;
  }
  const sorted = records.slice().sort((a, b) => (b.updated || b.created || "").localeCompare(a.updated || a.created || ""));
  list.innerHTML = sorted.map(rec => {
    const count = filledCount(rec.data);
    const when = formatDate(rec.updated || rec.created);
    return `<li class="record-row" data-id="${rec.id}">
      ${editingList ? `<button type="button" class="delete-btn" onclick="event.stopPropagation(); deleteRecord('${rec.id}')">−</button>` : ""}
      <div class="record-main" onclick="openRecord('${rec.id}')">
        <div class="record-name">${escapeHtml(rec.name || "Untitled")}</div>
        <div class="record-meta">${when}${count ? " · " + count : ""}</div>
      </div>
    </li>`;
  }).join("");
}

function showList() {
  document.getElementById("listScreen").style.display = "block";
  document.getElementById("formScreen").style.display = "none";
  currentId = null;
  renderList();
}

function showForm() {
  document.getElementById("listScreen").style.display = "none";
  document.getElementById("formScreen").style.display = "block";
  window.scrollTo(0, 0);
}

function toggleEditList() {
  editingList = !editingList;
  document.getElementById("editListBtn").textContent = editingList ? "Done" : "Edit";
  renderList();
}

function openNewDialog() {
  document.getElementById("newName").value = "";
  document.getElementById("newDialog").style.display = "flex";
  setTimeout(() => document.getElementById("newName").focus(), 50);
}

function closeNewDialog() {
  document.getElementById("newDialog").style.display = "none";
}

function createInspection() {
  const name = document.getElementById("newName").value.trim() || "New Inspection";
  const now = new Date().toISOString();
  const rec = { id: String(Date.now()), name, created: now, updated: now, config: {}, data: {} };
  records.unshift(rec);
  persistRecords();
  closeNewDialog();
  if (editingList) toggleEditList();
  openRecord(rec.id);
}

function openRecord(id) {
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  currentId = id;
  data = JSON.parse(JSON.stringify(rec.data || {}));
  writeFormConfig(rec.config);
  document.getElementById("formTitle").textContent = rec.name || "Inspection";
  document.getElementById("currentRoomTable").style.display = "none";
  document.getElementById("currentRoomTable").innerHTML = "";
  document.getElementById("output").textContent = "";
  activeRoom = "";
  if (rec.config && rec.config.numKitchens) configureRooms();
  else {
    document.getElementById("roomSelectSection").style.display = "none";
    roomList = [];
  }
  showForm();
}

function backToList() {
  saveData(true);
  showList();
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  persistRecords();
  renderList();
}

function saveData(silent) {
  flushVisibleInputs();
  if (!currentId) return;
  const rec = records.find(r => r.id === currentId);
  if (!rec) return;
  rec.config = readFormConfig();
  rec.data = JSON.parse(JSON.stringify(data));
  rec.updated = new Date().toISOString();
  persistRecords();
  if (!silent) alert("Saved.");
}

function saveCurrentRecord() {
  generateOutput();
  saveData(false);
}

document.getElementById("newName").addEventListener("keydown", function (e) {
  if (e.key === "Enter") createInspection();
});

loadRecords();
showList();
</script>
